<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('flowdeck-theme') || localStorage.getItem('flowdeck_theme');
          var theme = saved ? saved.replace(/['"]/g, '').trim().toLowerCase() : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <title>FLOWDECK — Plan. Collaborate. Deliver.</title>
